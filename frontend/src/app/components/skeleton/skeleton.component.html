<div class="skeleton" [class.skeleton-text]="variant === 'text'"
     [class.skeleton-circular]="variant === 'circular'"
     [class.skeleton-rectangular]="variant === 'rectangular'"
     [class.skeleton-card]="variant === 'card'"
     [class.skeleton-table-row]="variant === 'table-row'"
     [class.skeleton-stat]="variant === 'stat'"
     [class.animate-pulse]="animation === 'pulse'"
     [class.animate-wave]="animation === 'wave'"
     [style.width]="width"
     [style.height]="height">
</div>
