<div class="course-container">
  <div class="page-header">
    <div>
      <h1>{{ isEditMode ? 'Edit Course' : 'Create New Course' }}</h1>
      <p>{{ isEditMode ? 'Update course details' : 'Fill in the details to create a new course' }}</p>
    </div>
    <button class="cancel-btn" (click)="onCancel()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Cancel
    </button>
  </div>

  <form [formGroup]="courseForm" (ngSubmit)="onSubmit()" class="course-form">
    <div class="form-section">
      <div class="section-header">
        <h2>Course Information</h2>
        <span class="section-number">1</span>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label for="course_code">Course Code</label>
          <input type="text" id="course_code" formControlName="course_code" placeholder="e.g., CSE101 (optional)"
            [class.error]="course_code?.invalid && course_code?.touched" />
        </div>
        <div class="form-group">
          <label for="course_name">Course Name <span class="required">*</span></label>
          <input type="text" id="course_name" formControlName="course_name" placeholder="e.g., Introduction to Programming"
            [class.error]="course_name?.invalid && course_name?.touched" />
          <div class="error-message" *ngIf="course_name?.invalid && course_name?.touched">
            <span *ngIf="course_name?.errors?.['required']">Course name is required</span>
            <span *ngIf="course_name?.errors?.['minlength']">Course name must be at least 2 characters</span>
          </div>
        </div>
        <div class="form-group">
          <label for="batch_id">Batch</label>
          <select id="batch_id" formControlName="batch_id">
            <option [ngValue]="null">-- Select Batch (optional) --</option>
            <option *ngFor="let batch of batches" [ngValue]="batch.id">{{ batch.batch_name }} ({{ batch.batch_code }})</option>
          </select>
        </div>
        <div class="form-group">
          <label for="duration">Duration</label>
          <input type="number" id="duration" formControlName="duration" placeholder="month" min="1" />
        </div>
        <div class="form-group">
          <label for="total_fee">Total Fee</label>
          <input type="number" id="total_fee" formControlName="total_fee" placeholder="0.00" step="0.01" min="0" />
        </div>
        <div class="form-group">
          <label for="is_active">Status</label>
          <select id="is_active" formControlName="is_active">
            <option [ngValue]="true">Active</option>
            <option [ngValue]="false">Inactive</option>
          </select>
        </div>
        <div class="form-group full-width" style="grid-column: 1 / -1;">
          <label for="description">Description</label>
          <textarea id="description" formControlName="description" placeholder="Course description (optional)" rows="4"></textarea>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="onCancel()" [disabled]="isSubmitting">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="isSubmitting || courseForm.invalid">
        <span *ngIf="!isSubmitting">{{ isEditMode ? 'Update' : 'Create' }} Course</span>
        <span *ngIf="isSubmitting" class="loading">
          <span class="spinner"></span>
          {{ isEditMode ? 'Updating...' : 'Creating...' }}
        </span>
      </button>
    </div>
  </form>
</div>
