<div class="batch-container">
  <div class="page-header">
    <div>
      <h1>{{ isEditMode ? 'Edit Batch' : 'Create New Batch' }}</h1>
      <p>{{ isEditMode ? 'Update batch details' : 'Fill in the details to create a new batch' }}</p>
    </div>
    <button class="cancel-btn" (click)="onCancel()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Cancel
    </button>
  </div>

  <form [formGroup]="batchForm" (ngSubmit)="onSubmit()" class="batch-form">
    <div class="form-section">
      <div class="section-header">
        <h2>Batch Information</h2>
        <span class="section-number">1</span>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label for="batch_code">Batch Code <span class="required">*</span></label>
          <input type="text" id="batch_code" formControlName="batch_code" placeholder="e.g., B2024-01"
            [class.error]="batch_code?.invalid && batch_code?.touched" />
          <div class="error-message" *ngIf="batch_code?.invalid && batch_code?.touched">
            <span *ngIf="batch_code?.errors?.['required']">Batch code is required</span>
            <span *ngIf="batch_code?.errors?.['minlength']">Batch code must be at least 2 characters</span>
          </div>
        </div>
        <div class="form-group">
          <label for="batch_name">Batch Name <span class="required">*</span></label>
          <input type="text" id="batch_name" formControlName="batch_name" placeholder="e.g., Batch 2024"
            [class.error]="batch_name?.invalid && batch_name?.touched" />
          <div class="error-message" *ngIf="batch_name?.invalid && batch_name?.touched">
            <span *ngIf="batch_name?.errors?.['required']">Batch name is required</span>
            <span *ngIf="batch_name?.errors?.['minlength']">Batch name must be at least 2 characters</span>
          </div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="onCancel()" [disabled]="isSubmitting">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="isSubmitting || batchForm.invalid">
        <span *ngIf="!isSubmitting">{{ isEditMode ? 'Update' : 'Create' }} Batch</span>
        <span *ngIf="isSubmitting" class="loading">
          <span class="spinner"></span>
          {{ isEditMode ? 'Updating...' : 'Creating...' }}
        </span>
      </button>
    </div>
  </form>
</div>
